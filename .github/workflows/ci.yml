name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check cfcm/**/*.ts scripts/*.ts tests/*.ts

      # Every CFP must be internally consistent: schema, artifact hash,
      # provenance, license, and aliases that actually add recall.
      - name: Validate capability packages
        run: deno task validate

      # The committed index is derived from capabilities/. A PR that changes
      # one without the other fails here rather than shipping a stale registry.
      - name: Registry index is in sync
        run: deno run --allow-read --allow-write scripts/build-index.ts --check

      - name: Test
        run: deno task test
